services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: agrireach
      MYSQL_USER: agrireach_user
      MYSQL_PASSWORD: local_user_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
